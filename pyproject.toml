[project]
name = "feminicide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "branca>=0.8.2",
    "folium>=0.20.0",
    "geopandas>=1.1.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "requests>=2.32.5",
    "ruff>=0.16.6",
    "streamlit>=1.54.0",
    "streamlit-folium>=0.26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Version Python cible (pour les règles de modernisation)
target-version = "py311"

# Longueur de ligne (88 = défaut de Black)
line-length = 88

# Dossiers à ignorer
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.ipynb",
]

[tool.ruff.lint]
# Règles à activer
select = [
    "E",      # Erreurs de style pycodestyle
    "F",      # Erreurs Pyflakes (variables non utilisées, etc.)
    "I",      # Tri des imports (isort)
    "B",      # Bugs potentiels (flake8-bugbear)
    "UP",     # Modernisation syntaxe (pyupgrade)
    "SIM",    # Simplifications possibles
]

# Règles à ignorer
ignore = [
    "E501",   # Ligne trop longue (géré par le formatter)
]

# Règles que --fix peut corriger automatiquement
fixable = ["ALL"]

[tool.ruff.format]
# Style des guillemets (comme Black)
quote-style = "double"

# Indentation (comme Black)
indent-style = "space"